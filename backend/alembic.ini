# Alembic configuration file

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with the current working directory
prepend_sys_path = .

# Timezone for revision creation
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run env.py when generating 
# new revision files
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# corresponding .py files to be detected as revisions
# sourceless = false

# Version path separator
# version_path_separator = os

# Set to 'true' to use an all-hierarchical format for revisions
# use_hierarchical_view = false

# Output encoding
# output_encoding = utf-8

# Database URL (will be overridden by env.py)
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Hooks to run after new revision is created

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
